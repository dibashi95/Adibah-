<link rel="stylesheet" href="css/fonts.css">
<style>

  :root { --gold: #d2b07a; --mute: #8d8780; --line: rgba(255,255,255,.12); }

  .poster { position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(ellipse 46% 34% at 50% 54%, rgba(120,104,84,.42) 0%, rgba(60,52,44,.18) 45%, rgba(0,0,0,0) 100%),
      linear-gradient(180deg, #0b0a09 0%, #0e0d0c 64%, #12110f 65.8%, #1b1916 66%, #121110 82%, #080807 100%); }
  .floor { position: absolute; left: 0; right: 0; top: 890px; height: 1px; opacity: .6;

  .glow { position: absolute; left: 150px; top: 1000px; width: 780px; height: 120px; border-radius: 50%;
          background: radial-gradient(ellipse at center, rgba(210,176,122,.16), rgba(0,0,0,0) 70%); }

  .hdr { position: absolute; top: 54px; left: 72px; right: 72px; display: flex; justify-content: space-between; align-items: center; }
  .brand .w { font-family: "Mont", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 2px; line-height: 1;
              background: linear-gradient(180deg, #f3d48a, #c9962e); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand .s { font-family: "Mont", sans-serif; font-weight: 700; font-size: 8.2px; letter-spacing: 1.3px; color: #9a948c; margin-top: 3px; }
  .hdr .tag { font-weight: 500; font-size: 13.5px; letter-spacing: 4px; color: var(--mute); }

  .eyebrow { position: absolute; left: 72px; top: 150px; font-weight: 600; font-size: 15px; letter-spacing: 8px; color: var(--gold); }
  .h1 { position: absolute; left: 66px; top: 170px; font-family: "InterD", sans-serif; font-size: 128px; letter-spacing: -5px; line-height: .98; }
  .h1 .a { font-weight: 300; color: #f4f1ec; display: block; }
  .h1 .b { font-weight: 600; display: block;
           background: linear-gradient(180deg, #f6e2b6 0%, #d2b07a 55%, #a8834a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .price { position: absolute; right: 72px; top: 196px; text-align: right; }
  .price .lbl { font-weight: 600; font-size: 13px; letter-spacing: 4px; color: var(--mute); }
  .price .amt { margin-top: 8px; font-family: "InterD", sans-serif; font-weight: 500; font-size: 70px; letter-spacing: -2.5px; line-height: 1; }
  .price .amt .cur { font-size: 30px; letter-spacing: 0; margin-right: 6px; vertical-align: 28px; color: #cfc8bf; }
  .price .was { margin-top: 12px; font-size: 16px; color: var(--mute); }
  .price .was s { text-decoration-thickness: 1px; }
  .price .save { display: inline-block; margin-top: 14px; font-weight: 600; font-size: 12.5px; letter-spacing: 3px; color: var(--gold);
                 border: 1px solid rgba(210,176,122,.6); border-radius: 30px; padding: 7px 14px 7px 17px; }

  .prod-black { filter: drop-shadow(0 0 22px rgba(255,236,205,.06)); }

  .feats { position: absolute; left: 72px; right: 72px; top: 1112px; display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .f { padding: 4px 0 0 26px; border-left: 1px solid var(--line); }
  .f:first-child { padding-left: 0; border-left: 0; }
  .f svg { width: 28px; height: 28px; display: block; margin-bottom: 14px; }
  .f .t { font-family: "InterD", sans-serif; font-weight: 600; font-size: 21px; letter-spacing: -.2px; }
  .f .m { font-size: 14px; color: var(--mute); margin-top: 4px; }

  .fline { position: absolute; left: 72px; right: 72px; top: 1264px; height: 1px; background: var(--line); }
  .ftr { position: absolute; left: 72px; right: 72px; top: 1290px; display: flex; justify-content: space-between; align-items: center; }
  .ftr .co { font-weight: 600; font-size: 12.5px; letter-spacing: 3px; color: #6f6a64; }
  .ftr .cta { font-family: "InterD", sans-serif; font-weight: 500; font-size: 19px; color: var(--gold); display: flex; align-items: center; gap: 12px; }
  .ftr .cta .arr { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(210,176,122,.7); display: flex; align-items: center; justify-content: center; }
