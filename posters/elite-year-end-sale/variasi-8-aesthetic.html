<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIHAA Elite – Year-End Sale (Variasi 8: Aesthetic Studio)</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #fff; }
  body { font-family: "InterX", sans-serif; color: #2f2117; -webkit-font-smoothing: antialiased; font-variant-numeric: lining-nums; }
  :root { --esp: #2f2117; --brown: #8a6a4e; --mute: #8c7562; --gold: #b8873c; }

  .poster { position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: linear-gradient(180deg, #e9dbc8 0%, #e2d0b9 74.6%, #d8c4aa 74.8%, #d1bb9f 100%); }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* window light + arch niche */
  .light { position: absolute; left: 470px; top: -80px; width: 460px; height: 1000px; transform: skewX(-24deg);
           background: linear-gradient(180deg, rgba(255,250,240,.5), rgba(255,250,240,.08)); filter: blur(22px); }
  .arch { position: absolute; left: 170px; top: 330px; width: 740px; height: 680px; border-radius: 370px 370px 0 0;
          background: linear-gradient(180deg, #f7efe4 0%, #efe4d5 100%);
          box-shadow: inset 30px 14px 50px rgba(130,96,62,.22), inset -14px 0 30px rgba(255,255,255,.5), 0 0 0 1px rgba(255,255,255,.35); }
  .floor-line { position: absolute; left: 0; right: 0; top: 1008px; height: 2px; background: linear-gradient(180deg, rgba(120,90,60,.18), rgba(0,0,0,0)); }

  /* podiums */
  .pod { position: absolute; }
  .pod .body { position: absolute; left: 0; width: 100%;
               background: linear-gradient(90deg, #cdb89c 0%, #e6d7c3 18%, #f4ece1 40%, #efe4d5 62%, #d8c5ac 86%, #c6b092 100%); }
  .pod .top { position: absolute; left: 0; width: 100%; border-radius: 50%;
              background: radial-gradient(ellipse at 42% 40%, #fbf6ef 0%, #f1e7da 70%, #e3d4c0 100%);
              box-shadow: inset 0 -2px 3px rgba(140,110,80,.25); }
  .pod-shadow { position: absolute; border-radius: 50%; background: rgba(90,62,35,.35); filter: blur(16px); }
  .m-shadow { position: absolute; border-radius: 50%; background: rgba(60,40,20,.55); filter: blur(8px); }

  .prod-white { filter: brightness(1.07) contrast(1.04) saturate(.92); }
  .prod-black { filter: contrast(1.05); }

  /* type */
  .logo { position: absolute; top: 40px; left: 0; right: 0; text-align: center; }
  .logo .w { font-family: "Mont", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 2px; line-height: 1;
             background: linear-gradient(180deg, #d9a637, #a9760f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo .s { font-family: "Mont", sans-serif; font-weight: 700; font-size: 8.2px; letter-spacing: 1.3px; color: #7d6650; margin-top: 3px; }
  .eyebrow { position: absolute; top: 116px; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 13.5px; letter-spacing: 6px; padding-left: 6px; color: var(--brown); }
  .h1 { position: absolute; top: 132px; left: 0; right: 0; text-align: center; font-family: "Playfair", serif; font-weight: 500; font-size: 112px;
        letter-spacing: -2px; line-height: 1.12; color: var(--esp); }
  .h1 em { font-style: italic; font-weight: 500; color: #9b6c33; }
  .sub { position: absolute; top: 270px; left: 0; right: 0; text-align: center; font-weight: 400; font-size: 20px; letter-spacing: .2px; color: #6e5a48; }

  .seal { position: absolute; left: 886px; top: 288px; width: 156px; height: 156px; transform: rotate(-8deg);
          filter: drop-shadow(0 10px 16px rgba(60,40,20,.28)); }
  .seal .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f6ecdc; }
  .seal .c .k { font-weight: 600; font-size: 11px; letter-spacing: 3px; padding-left: 3px; }
  .seal .c .v { font-family: "Playfair", serif; font-style: italic; font-weight: 600; font-size: 31px; line-height: 1.05; }

  /* price + features */
  .price { position: absolute; left: 72px; top: 1086px; }
  .price .lbl { font-weight: 600; font-size: 12.5px; letter-spacing: 4px; color: var(--mute); }
  .price .amt { font-family: "Playfair", serif; font-weight: 600; font-size: 90px; letter-spacing: -1.5px; line-height: 1.05; color: var(--esp); }
  .price .amt .cur { font-size: 38px; margin-right: 8px; vertical-align: 38px; letter-spacing: 0; }
  .price .was { margin-top: 4px; display: flex; align-items: center; gap: 14px; font-size: 17px; color: #7a6552; }
  .price .was s { text-decoration-thickness: 1.5px; }
  .price .save { font-weight: 600; font-size: 12px; letter-spacing: 2.5px; color: #f6ecdc; background: var(--esp); border-radius: 30px; padding: 7px 13px 7px 15px; }

  .vline { position: absolute; left: 586px; top: 1098px; width: 1px; height: 150px; background: rgba(90,62,35,.22); }
  .feats { position: absolute; left: 626px; top: 1104px; display: flex; flex-direction: column; gap: 30px; }
  .f { display: flex; align-items: center; gap: 18px; }
  .f .ic { width: 54px; height: 54px; border-radius: 50%; background: var(--esp); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .f .ic svg { width: 26px; height: 26px; }
  .f .t { font-family: "Playfair", serif; font-weight: 600; font-size: 24px; letter-spacing: -.2px; }
  .f .m { font-size: 14.5px; color: #7a6552; margin-top: 1px; }

  .ftr { position: absolute; left: 72px; right: 72px; top: 1278px; display: flex; justify-content: space-between; align-items: center; }
  .sw { display: flex; align-items: center; gap: 10px; font-size: 15.5px; color: #5d4a3a; }
  .sw .d { width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 2px #f4ebdf, 0 2px 6px rgba(60,40,20,.25); }
  .sw .d.k { background: linear-gradient(135deg, #3a3a3a, #0c0c0c); margin-left: 4px; }
  .sw .d.w { background: linear-gradient(135deg, #fff, #e8e4de); margin-left: 6px; }
  .btn { display: flex; align-items: center; gap: 12px; background: var(--esp); color: #f6ecdc; border-radius: 40px; padding: 13px 15px 13px 26px;
         font-weight: 600; font-size: 16.5px; letter-spacing: .3px; }
  .btn .arr { width: 30px; height: 30px; border-radius: 50%; background: #f6ecdc; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="poster" id="poster">
  <div class="light"></div>
  <div class="arch"></div>

  <!-- leaf shadows on the wall -->
  <svg class="layer" width="1080" height="1350" viewBox="0 0 1080 1350" style="mix-blend-mode: multiply;">
    <defs><filter id="leafBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter></defs>
    <g id="leaves" filter="url(#leafBlur)" fill="rgba(96,66,36,.17)" stroke="rgba(96,66,36,.17)"></g>
  </svg>

  <div class="floor-line"></div>

  <div class="logo"><div class="w">AIHAA</div><div class="s">MARKETING SDN BHD</div></div>
  <div class="eyebrow">AIHAA ELITE · 2026</div>
  <div class="h1">Year-End <em>Sale</em></div>
  <div class="sub">Save RM400 on AIHAA Elite, in black or white.</div>

  <div id="stage"></div>

  <div class="seal">
    <svg width="156" height="156" viewBox="0 0 156 156">
      <circle cx="78" cy="78" r="76" fill="#2f2117"/>
      <circle cx="78" cy="78" r="70" fill="none" stroke="#c99a55" stroke-width="1"/>
      <path id="ring" d="M78,78 m-56,0 a56,56 0 1,1 112,0 a56,56 0 1,1 -112,0" fill="none"/>
      <text font-family="InterX" font-weight="600" font-size="10.5" letter-spacing="3.2" fill="#c99a55">
        <textPath href="#ring" startOffset="0">YEAR-END SALE · 2026 · YEAR-END SALE · 2026 ·</textPath>
      </text>
      <circle cx="78" cy="78" r="40" fill="none" stroke="rgba(201,154,85,.45)" stroke-width="1"/>
    </svg>
    <div class="c"><div class="k">SAVE</div><div class="v">RM400</div></div>
  </div>

  <div class="price">
    <div class="lbl">PROMO PRICE</div>
    <div class="amt"><span class="cur">RM</span>1,280</div>
    <div class="was"><span>Normal price <s>RM1,680</s></span><span class="save">SAVE RM400</span></div>
  </div>
  <div class="vline"></div>
  <div class="feats">
    <div class="f">
      <div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#f6ecdc" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M30.5 7.5a9 9 0 0 0-8.9 11.6L8.8 31.9a3.6 3.6 0 0 0 5.1 5.1l12.8-12.8A9 9 0 0 0 38.3 15l-5.6 5.6-4.9-1.3-1.3-4.9 5.6-5.6a9 9 0 0 0-1.6-1.3z"/></svg></div>
      <div><div class="t">Free Installation</div><div class="m">Percuma pemasangan</div></div>
    </div>
    <div class="f">
      <div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#f6ecdc" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 9 10.5v11.2c0 9.6 6.3 17.4 15 20.8 8.7-3.4 15-11.2 15-20.8V10.5L24 5z"/><path d="m17 24 5 5 9.5-10"/></svg></div>
      <div><div class="t">3-Year Warranty</div><div class="m">Waranti 3 tahun</div></div>
    </div>
  </div>

  <div class="ftr">
    <div class="sw">Available in<span class="d k"></span><span class="d w"></span></div>
    <div class="btn">Book yours today<span class="arr"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#2f2117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></div>
  </div>
</div>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const stage = document.getElementById("stage");
  const add = (cls, css) => { const d = document.createElement("div"); d.className = cls; d.style.cssText = css; stage.appendChild(d); return d; };

  // Palm-frond leaf shadows
  const leaves = document.getElementById("leaves");
  function frond(x0, y0, x1, y1, bend, n, len, wid, side) {
    const p = document.createElementNS(NS, "path");
    const mx = (x0 + x1) / 2 + bend, my = (y0 + y1) / 2 - bend * .4;
    p.setAttribute("d", `M${x0} ${y0} Q ${mx} ${my} ${x1} ${y1}`); p.setAttribute("fill", "none"); p.setAttribute("stroke-width", 5);
    leaves.appendChild(p);
    for (let i = 1; i < n; i++) {
      const t = i / n, it = 1 - t;
      const x = it * it * x0 + 2 * it * t * mx + t * t * x1, y = it * it * y0 + 2 * it * t * my + t * t * y1;
      const dx = 2 * it * (mx - x0) + 2 * t * (x1 - mx), dy = 2 * it * (my - y0) + 2 * t * (y1 - my);
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      const L = len * (0.55 + 0.45 * Math.sin(Math.PI * t));
      for (const s of side) {
        const e = document.createElementNS(NS, "ellipse");
        e.setAttribute("cx", L / 2); e.setAttribute("cy", 0); e.setAttribute("rx", L / 2); e.setAttribute("ry", wid);
        e.setAttribute("stroke", "none");
        e.setAttribute("transform", `translate(${x} ${y}) rotate(${ang + s * 62})`);
        leaves.appendChild(e);
      }
    }
  }
  frond(1120, 40, 700, 520, 60, 13, 150, 13, [1, -1]);
  frond(1110, 300, 820, 720, -40, 10, 120, 11, [1, -1]);
  frond(-40, 160, 210, 520, -50, 9, 110, 10, [1, -1]);

  // Cylinder podiums
  function podium(cx, topY, w, h, ry) {
    const p = add("pod", `left:${cx - w / 2}px; top:${topY - ry}px; width:${w}px; height:${h + 2 * ry}px;`);
    const body = document.createElement("div"); body.className = "body";
    body.style.cssText = `top:${ry}px; height:${h + ry}px; border-radius: 0 0 ${w / 2}px ${w / 2}px / 0 0 ${ry}px ${ry}px;`;
    const top = document.createElement("div"); top.className = "top";
    top.style.cssText = `top:0; height:${2 * ry}px;`;
    p.appendChild(body); p.appendChild(top);
  }
  add("pod-shadow", "left:120px; top:1046px; width:460px; height:44px;");
  add("pod-shadow", "left:520px; top:1046px; width:480px; height:44px;");
  podium(745, 902, 420, 136, 38);
  podium(332, 968, 400, 70, 36);

  // Machines on the podiums (bbox data from the original artwork)
  const M = {
    black: { x: 90.67, y: 292.67, w: 363.67, h: 558.67, base: 845, src: "assets/elite-black-cutout.png" },
    white: { x: 479.67, y: 307.67, w: 381.67, h: 551.67, base: 853, src: "assets/elite-white-cutout.png" },
  };
  function machine(k, cx, baseY, s) {
    const m = M[k], w = m.w * s, h = m.h * s, left = cx - w / 2, top = baseY - (m.base - m.y) * s;
    add("m-shadow", `left:${left + w * .08}px; top:${baseY - 16}px; width:${w * .9}px; height:24px;`);
    const img = document.createElement("img"); img.src = m.src; img.className = "prod-" + k; img.alt = "AIHAA Elite " + k;
    img.style.cssText = `position:absolute; left:${left}px; top:${top}px; width:${w}px; height:${h}px;`;
    stage.appendChild(img);
  }
  machine("white", 748, 914, 0.96);
  machine("black", 330, 982, 0.96);
</script>
</body>
</html>
