<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>AIHAA Elite – Year End Sale</title>
<style>
  @font-face { font-family: "Mont"; font-weight: 400; src: url("fonts/montserrat-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Mont"; font-weight: 500; src: url("fonts/montserrat-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Mont"; font-weight: 600; src: url("fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Mont"; font-weight: 700; src: url("fonts/montserrat-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Mont"; font-weight: 800; src: url("fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Mont"; font-weight: 900; src: url("fonts/montserrat-latin-900-normal.woff2") format("woff2"); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #000; }
  body { font-family: "Mont", sans-serif; }

  .poster {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 45% at 50% 52%, rgba(120, 86, 45, .38) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 90% 60% at 50% 18%, #2b2119 0%, #15100c 55%, #070504 100%);
  }
  .layer { position: absolute; inset: 0; }

  /* Light beams */
  .beam { position: absolute; width: 1600px; height: 2px; left: -260px;
          background: linear-gradient(90deg, rgba(255,214,140,0) 0%, rgba(255,214,140,.55) 45%, rgba(255,244,214,.9) 50%, rgba(255,214,140,.55) 55%, rgba(255,214,140,0) 100%);
          filter: blur(.6px); box-shadow: 0 0 18px 2px rgba(255,190,90,.35); }

  /* Logo */
  .logo { position: absolute; top: 34px; left: 0; right: 0; text-align: center; }
  .logo .brand {
    font-weight: 800; font-size: 50px; letter-spacing: 3px; line-height: 1;
    background: linear-gradient(180deg, #ffe58a 0%, #f6c536 50%, #d99a12 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
  }
  .logo .sub { margin-top: 4px; font-weight: 700; font-size: 13.5px; letter-spacing: 1.6px; color: #fff; }

  .title { position: absolute; top: 96px; left: 0; width: 1080px; height: 270px; overflow: visible; }

  /* Savings seal */
  .seal { position: absolute; left: 842px; top: 150px; width: 186px; height: 186px; transform: rotate(-11deg);
          filter: drop-shadow(0 10px 18px rgba(0,0,0,.6)); }
  .seal .txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #3a2405; }
  .seal .t1 { font-weight: 800; font-size: 25px; letter-spacing: 5px; line-height: 1; margin-left: 5px; }
  .seal .t2 { font-weight: 900; font-size: 44px; letter-spacing: -.5px; line-height: 1.02; }

  /* Product */
  .product { position: absolute; top: 328px; left: 40px; width: 1000px; height: auto; }

  /* Price block */
  .price { position: absolute; left: 58px; top: 1064px; width: 520px; }
  .price .lbl { font-weight: 500; font-size: 21px; letter-spacing: 4.5px; color: #e6dac5; }
  .price .normal-row { display: flex; align-items: baseline; gap: 18px; }
  .price .old { position: relative; display: inline-block; font-weight: 500; font-size: 46px; letter-spacing: 2px; color: #d8cbb3; line-height: 1.05; }
  .price .old::after { content: ""; position: absolute; left: -4px; right: -4px; top: 52%; height: 3.5px; background: #e3262c;
                       transform: rotate(-4deg); border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .price .promo-lbl { margin-top: 8px; font-weight: 500; font-size: 33px; letter-spacing: 4.5px; color: #f3e5c6; line-height: 1; }
  .price .new {
    margin-top: 0; font-weight: 800; font-size: 100px; letter-spacing: 1px; line-height: 1;
    background: linear-gradient(180deg, #fffaf0 0%, #f7e7c2 45%, #e2c084 70%, #f8e9c6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(255,200,110,.28)) drop-shadow(0 4px 6px rgba(0,0,0,.7));
  }
  .price .new .rm { margin-right: 14px; }
  .glowline { position: absolute; left: 40px; top: 1266px; width: 520px; height: 3px;
              background: linear-gradient(90deg, rgba(255,200,110,0), rgba(255,226,160,.95) 35%, rgba(255,200,110,.9) 65%, rgba(255,200,110,0));
              box-shadow: 0 0 14px 3px rgba(255,190,90,.45); border-radius: 2px; }

  /* Perks */
  .perks { position: absolute; left: 600px; top: 1086px; width: 430px; display: flex; flex-direction: column; gap: 30px; }
  .perk { position: relative; height: 76px; }
  .perk .pill { position: absolute; left: 56px; right: 0; top: 4px; height: 68px; border-radius: 40px;
                border: 2px solid rgba(255,248,232,.9); background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(30,22,14,.35));
                display: flex; align-items: center; padding-left: 52px;
                color: #fff; font-weight: 700; font-size: 20px; letter-spacing: 5px; line-height: 1.25; }
  .perk .ic { position: absolute; left: 0; top: -8px; width: 92px; height: 92px; border-radius: 50%;
              background: radial-gradient(circle at 35% 30%, #f7dfa0 0%, #d6a650 38%, #a7742a 70%, #6f4a17 100%);
              box-shadow: 0 0 0 3px rgba(20,14,8,.9), 0 0 0 4.5px rgba(240,205,130,.8), 0 8px 18px rgba(0,0,0,.6);
              display: flex; align-items: center; justify-content: center; }
  .perk .ic svg { width: 50px; height: 50px; }

  /* Urgency bar */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 66px;
         background: linear-gradient(90deg, #8a5c1a 0%, #d9a944 18%, #fbe3a0 50%, #d9a944 82%, #8a5c1a 100%);
         display: flex; align-items: center; justify-content: center; gap: 22px;
         color: #2a1a05; font-weight: 800; font-size: 25px; letter-spacing: 3.5px;
         box-shadow: 0 -6px 24px rgba(255,190,90,.25); }
  .bar .dot { width: 10px; height: 10px; background: #2a1a05; transform: rotate(45deg); }
</style>
</head>
<body>
<div class="poster" id="poster">

  <!-- Background: gold arcs, beams, bokeh, confetti -->
  <svg class="layer" width="1080" height="1350" viewBox="0 0 1080 1350">
    <defs>
      <linearGradient id="arcG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffd890" stop-opacity="0"/>
        <stop offset=".35" stop-color="#ffd890" stop-opacity=".95"/>
        <stop offset=".7" stop-color="#c99a4b" stop-opacity=".6"/>
        <stop offset="1" stop-color="#c99a4b" stop-opacity="0"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="bokeh"><feGaussianBlur stdDeviation="6"/></filter>
      <linearGradient id="pillarG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#3a2a17"/><stop offset=".45" stop-color="#e8c27a"/><stop offset=".55" stop-color="#fff0c8"/><stop offset="1" stop-color="#3a2a17"/>
      </linearGradient>
      <linearGradient id="pillarFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff" stop-opacity="1"/><stop offset=".8" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="pm"><rect x="0" y="0" width="1080" height="1100" fill="url(#pillarFade)"/></mask>
    </defs>
    <!-- side light pillars -->
    <g mask="url(#pm)" opacity=".55">
      <rect x="1040" y="0" width="6" height="1100" fill="url(#pillarG)"/>
      <rect x="1056" y="0" width="3" height="1100" fill="url(#pillarG)"/>
      <rect x="34" y="0" width="6" height="1100" fill="url(#pillarG)"/>
      <rect x="21" y="0" width="3" height="1100" fill="url(#pillarG)"/>
    </g>
    <!-- sweeping arcs -->
    <path d="M -40 520 C 180 420, 420 470, 640 610" stroke="url(#arcG)" stroke-width="2.4" fill="none" filter="url(#glow)"/>
    <path d="M 1120 470 C 900 380, 700 420, 520 560" stroke="url(#arcG)" stroke-width="1.6" fill="none" filter="url(#glow)" opacity=".7"/>
    <g id="bokehLayer" filter="url(#bokeh)"></g>
    <g id="confetti"></g>
  </svg>

  <!-- Logo -->
  <div class="logo">
    <div class="brand">AIHAA</div>
    <div class="sub">MARKETING SDN BHD</div>
  </div>

  <!-- 3D title -->
  <svg class="title" viewBox="0 0 1080 270">
    <defs>
      <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff6cf"/>
        <stop offset=".3" stop-color="#ffdb73"/>
        <stop offset=".55" stop-color="#e2a62b"/>
        <stop offset=".78" stop-color="#ffe8a0"/>
        <stop offset="1" stop-color="#b47718"/>
      </linearGradient>
      <linearGradient id="silverFace" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".46" stop-color="#f6f2ea"/>
        <stop offset=".56" stop-color="#d4cdbf"/>
        <stop offset=".8" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#e3ddd2"/>
      </linearGradient>
      <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff1b8"/>
        <stop offset=".25" stop-color="#d49a2c"/>
        <stop offset=".5" stop-color="#ffe49a"/>
        <stop offset=".75" stop-color="#b8801f"/>
        <stop offset="1" stop-color="#ffe7a6"/>
      </linearGradient>
      <filter id="tshadow" x="-10%" y="-20%" width="120%" height="150%">
        <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".75"/>
      </filter>
      <radialGradient id="spark" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff" stop-opacity="1"/>
        <stop offset=".25" stop-color="#fff4d6" stop-opacity=".8"/>
        <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
      </radialGradient>
      <text id="yearend" x="540" y="92" text-anchor="middle" font-family="Mont" font-weight="900" font-size="96" letter-spacing="2">YEAR END</text>
      <text id="sale" x="540" y="248" text-anchor="middle" font-family="Mont" font-weight="900" font-size="170" letter-spacing="8">SALE</text>
      <symbol id="star" viewBox="-50 -50 100 100" overflow="visible">
        <circle r="34" fill="url(#spark)"/>
        <path d="M0 -50 C 3 -8, 8 -3, 50 0 C 8 3, 3 8, 0 50 C -3 8, -8 3, -50 0 C -8 -3, -3 -8, 0 -50 Z" fill="#fffaf0"/>
      </symbol>
    </defs>

    <!-- YEAR END : gold 3D -->
    <g filter="url(#tshadow)">
      <g id="yeExtrude" fill="#6b4410" stroke="#6b4410" stroke-width="10" stroke-linejoin="round"></g>
      <use href="#yearend" fill="#3b2506" stroke="url(#goldRim)" stroke-width="10" stroke-linejoin="round"/>
      <use href="#yearend" fill="url(#goldFace)"/>
    </g>

    <!-- SALE : silver/white face, gold rim, gold extrusion -->
    <g filter="url(#tshadow)">
      <g id="saleExtrude" stroke-width="14" stroke-linejoin="round"></g>
      <use href="#sale" fill="#2b1b05" stroke="url(#goldRim)" stroke-width="14" stroke-linejoin="round"/>
      <use href="#sale" fill="url(#silverFace)"/>
    </g>

    <!-- sparkles -->
    <use href="#star" x="222" y="4" width="70" height="70"/>
    <use href="#star" x="760" y="98" width="54" height="54"/>
    <use href="#star" x="246" y="200" width="44" height="44"/>
  </svg>

  <!-- Savings seal -->
  <div class="seal">
    <svg width="186" height="186" viewBox="-93 -93 186 186">
      <defs>
        <radialGradient id="sealG" cx=".38" cy=".32" r=".75">
          <stop offset="0" stop-color="#fff3c2"/>
          <stop offset=".45" stop-color="#f0c35a"/>
          <stop offset="1" stop-color="#b47a1d"/>
        </radialGradient>
      </defs>
      <path id="burst" fill="url(#sealG)" stroke="#fff0c0" stroke-width="1.2"></path>
      <circle r="70" fill="none" stroke="#5a3a0b" stroke-width="2" stroke-dasharray="3 5" opacity=".75"/>
      <circle r="64" fill="none" stroke="#fff6d6" stroke-width="1.5" opacity=".8"/>
    </svg>
    <div class="txt">
      <div class="t1">JIMAT</div>
      <div class="t2">RM400</div>
    </div>
  </div>

  <!-- Product (from original AIHAA Elite artwork) -->
  <img class="product" src="assets/elite.png" alt="AIHAA Elite hitam dan putih">

  <!-- Price -->
  <div class="price">
    <div class="normal-row">
      <span class="lbl">NORMAL PRICE</span>
      <span class="old">RM1,680</span>
    </div>
    <div class="promo-lbl">PROMOTION PRICE</div>
    <div class="new"><span class="rm">RM</span>1,280</div>
  </div>
  <div class="glowline"></div>

  <!-- Perks -->
  <div class="perks">
    <div class="perk">
      <div class="pill">PERCUMA<br>PEMASANGAN</div>
      <div class="ic">
        <svg viewBox="0 0 48 48" fill="none" stroke="#fffaf0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30.5 7.5a9 9 0 0 0-8.9 11.6L8.8 31.9a3.6 3.6 0 0 0 5.1 5.1l12.8-12.8A9 9 0 0 0 38.3 15l-5.6 5.6-4.9-1.3-1.3-4.9 5.6-5.6a9 9 0 0 0-1.6-1.3z"/>
          <circle cx="11.6" cy="34.2" r="1.2" fill="#fffaf0" stroke="none"/>
        </svg>
      </div>
    </div>
    <div class="perk">
      <div class="pill">3 TAHUN<br>WARRANTY</div>
      <div class="ic">
        <svg viewBox="0 0 48 48" fill="none" stroke="#fffaf0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 5 9 10.5v11.2c0 9.6 6.3 17.4 15 20.8 8.7-3.4 15-11.2 15-20.8V10.5L24 5z"/>
          <path d="m17 24 5 5 9.5-10"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Urgency / CTA bar -->
  <div class="bar">
    <span>PROMOSI HUJUNG TAHUN 2026</span>
    <span class="dot"></span>
    <span>TEMPAH SEKARANG!</span>
  </div>
</div>

<script>
  const NS = "http://www.w3.org/2000/svg";
  // Deterministic PRNG so every render is identical
  let seed = 20261231;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  // 3D extrusion layers for the title
  const ye = document.getElementById("yeExtrude");
  for (let i = 9; i >= 1; i--) {
    const u = document.createElementNS(NS, "use");
    u.setAttribute("href", "#yearend"); u.setAttribute("y", i);
    ye.appendChild(u);
  }
  const se = document.getElementById("saleExtrude");
  for (let i = 13; i >= 1; i--) {
    const u = document.createElementNS(NS, "use");
    const t = i / 13;
    const c = `rgb(${Math.round(196 - 100 * t)},${Math.round(140 - 78 * t)},${Math.round(48 - 30 * t)})`;
    u.setAttribute("href", "#sale"); u.setAttribute("y", i);
    u.setAttribute("fill", c); u.setAttribute("stroke", c);
    se.appendChild(u);
  }

  // Starburst seal outline
  (() => {
    const pts = [], n = 28, R = 92, r = 82;
    for (let i = 0; i < n * 2; i++) {
      const a = (Math.PI * i) / n, rad = i % 2 ? r : R;
      pts.push(`${(rad * Math.cos(a)).toFixed(2)},${(rad * Math.sin(a)).toFixed(2)}`);
    }
    document.getElementById("burst").setAttribute("d", "M" + pts.join("L") + "Z");
  })();

  // Bokeh
  const bk = document.getElementById("bokehLayer");
  const bokehSpots = [[90,150,26],[180,70,14],[960,90,22],[1010,240,12],[70,330,16],[880,380,10],[150,1030,18],[960,1000,20],[520,1040,12],[300,40,10],[760,40,12],[40,820,14],[1030,720,16]];
  for (const [x, y, r] of bokehSpots) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", "#ffcf7a"); c.setAttribute("opacity", (0.18 + rnd() * 0.22).toFixed(2));
    bk.appendChild(c);
  }

  // Gold confetti, kept to the edges so it never covers text or product
  const cf = document.getElementById("confetti");
  const golds = ["#f7d27a", "#e2ad4a", "#fff0bf", "#c58f2e", "#ffe08f"];
  const zones = [
    [0, 0, 250, 330, 22], [830, 0, 250, 150, 14], [0, 330, 120, 520, 10], [990, 360, 90, 520, 9],
    [300, 0, 480, 34, 6]
  ];
  for (const [zx, zy, zw, zh, count] of zones) {
    for (let i = 0; i < count; i++) {
      const x = zx + rnd() * zw, y = zy + rnd() * zh;
      const kind = rnd();
      let el;
      if (kind < 0.55) {
        el = document.createElementNS(NS, "rect");
        const w = 6 + rnd() * 10, h = 3 + rnd() * 5;
        el.setAttribute("x", -w / 2); el.setAttribute("y", -h / 2);
        el.setAttribute("width", w); el.setAttribute("height", h); el.setAttribute("rx", 1);
      } else if (kind < 0.8) {
        el = document.createElementNS(NS, "circle");
        el.setAttribute("r", 1.8 + rnd() * 2.6);
      } else {
        el = document.createElementNS(NS, "path");
        const l = 18 + rnd() * 18;
        el.setAttribute("d", `M0 0 q ${l / 3} ${-l / 4} ${l / 1.6} 0 t ${l / 1.6} 0`);
        el.setAttribute("fill", "none"); el.setAttribute("stroke-width", 2.2);
      }
      const col = golds[Math.floor(rnd() * golds.length)];
      if (el.tagName === "path") el.setAttribute("stroke", col); else el.setAttribute("fill", col);
      el.setAttribute("opacity", (0.55 + rnd() * 0.45).toFixed(2));
      el.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${Math.round(rnd() * 360)})`);
      cf.appendChild(el);
    }
  }
</script>
</body>
</html>
