<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIHAA Elite – Year-End Sale (Variasi 6: Swiss Bold)</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #fff; }
  body { font-family: "InterX", sans-serif; color: #111; -webkit-font-smoothing: antialiased; }
  :root { --red: #d3262d; --ink: #111111; --paper: #f1eee8; }

  .poster { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--paper); }
  .red { position: absolute; left: 0; top: 0; width: 1080px; height: 660px; background: var(--red); }

  .hdr { position: absolute; top: 48px; left: 56px; right: 56px; display: flex; justify-content: space-between; align-items: flex-start; color: #fff; }
  .brand .w { font-family: "Mont", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 2px; line-height: 1; }
  .brand .s { font-family: "Mont", sans-serif; font-weight: 700; font-size: 8.2px; letter-spacing: 1.3px; margin-top: 3px; opacity: .8; }
  .hdr .meta { text-align: right; font-weight: 600; font-size: 14px; line-height: 1.45; letter-spacing: .3px; }
  .hdr .meta span { opacity: .75; font-weight: 500; }
  .rule-w { position: absolute; left: 56px; right: 56px; top: 116px; height: 2px; background: #fff; }

  .h1 { position: absolute; left: 46px; top: 132px; color: #fff; font-family: "InterD", sans-serif; font-weight: 700;
        font-size: 212px; letter-spacing: -11px; line-height: .84; }

  .price { position: absolute; left: 560px; top: 356px; color: #fff; }
  .price .lbl { font-weight: 600; font-size: 15px; letter-spacing: .5px; display: flex; gap: 12px; align-items: center; }
  .price .lbl i { display: inline-block; width: 26px; height: 2px; background: #fff; }
  .price .amt { margin-top: 4px; font-family: "InterD", sans-serif; font-weight: 700; font-size: 112px; letter-spacing: -6px; line-height: 1; }
  .price .amt .cur { font-size: 40px; letter-spacing: -1px; margin-right: 6px; vertical-align: 54px; }
  .price .was { margin-top: 10px; font-weight: 500; font-size: 19px; }
  .price .was s { opacity: .8; text-decoration-thickness: 2px; }

  .shadow { position: absolute; border-radius: 50%; background: rgba(30,20,15,.45); filter: blur(12px); }

  .rule-k { position: absolute; left: 56px; right: 56px; top: 1150px; height: 3px; background: var(--ink); }
  .cols { position: absolute; left: 56px; right: 56px; top: 1170px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .col .n { font-family: "InterD", sans-serif; font-weight: 700; font-size: 15px; color: var(--red); }
  .col .t { margin-top: 8px; font-family: "InterD", sans-serif; font-weight: 700; font-size: 25px; letter-spacing: -.6px; line-height: 1.1; }
  .col .m { margin-top: 4px; font-size: 15px; color: #6b6661; }

  .ftr { position: absolute; left: 56px; right: 56px; bottom: 34px; display: flex; justify-content: space-between; align-items: center; }
  .ftr .co { font-weight: 600; font-size: 13px; letter-spacing: 2px; color: #6b6661; }
  .ftr .cta { display: flex; align-items: center; gap: 12px; font-family: "InterD", sans-serif; font-weight: 700; font-size: 20px; }
  .ftr .cta .arr { width: 36px; height: 36px; background: var(--red); display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="poster" id="poster">
  <div class="red"></div>

  <div class="hdr">
    <div class="brand"><div class="w">AIHAA</div><div class="s">MARKETING SDN BHD</div></div>
    <div class="meta">AIHAA Elite<br><span>Year-End Promotion 2026</span></div>
  </div>
  <div class="rule-w"></div>

  <div class="h1">Year-End<br>Sale</div>

  <div class="price">
    <div class="lbl"><i></i>Promo price</div>
    <div class="amt"><span class="cur">RM</span>1,280</div>
    <div class="was">Normal price <s>RM1,680</s></div>
  </div>

  <div class="shadow" style="left:150px; top:1112px; width:400px; height:26px;"></div>
  <div class="shadow" style="left:560px; top:1120px; width:420px; height:26px;"></div>

  <div class="rule-k"></div>
  <div class="cols">
    <div class="col"><div class="n">01</div><div class="t">Save RM400</div><div class="m">Jimat RM400</div></div>
    <div class="col"><div class="n">02</div><div class="t">Free Installation</div><div class="m">Percuma pemasangan</div></div>
    <div class="col"><div class="n">03</div><div class="t">3-Year Warranty</div><div class="m">Waranti 3 tahun</div></div>
  </div>

  <div class="ftr">
    <div class="co">BLACK / WHITE</div>
    <div class="cta">Book yours today<span class="arr"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="square"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></div>
  </div>
</div>
<script src="js/products.js"></script>
<script>placeElite({ scale: 1.0, centerX: 556, bottom: 1128 });</script>
</body>
</html>
